<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f8"><title>画图 · 本地画室</title><link rel="stylesheet" href="style.css?v=mobile-2"></head>
<body>
<header><div class="brand"><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-title"><b>画图</b><span class="subtitle">本地画室</span></span></div><div class="actions"><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Y">↷</button><span class="divider"></span><button id="new">新建</button><button id="open">打开图片</button><button id="save" class="primary">↓ 导出图片</button></div></header>
<main><section class="ribbon">
<button id="menuToggle" aria-label="文件菜单" aria-expanded="false" aria-controls="fileMenu">☰</button>
<div class="group main-tools"><label>工具</label><div class="tools" id="tools"><button data-tool="brush" class="selected" title="画笔 B">✎<small>画笔</small></button><button data-tool="eraser" title="橡皮 E">▱<small>橡皮</small></button><button data-tool="fill" title="填充 F">◒<small>填充</small></button><button data-tool="picker" title="取色 I">⌖<small>取色</small></button><button data-tool="text" title="文字 T">T<small>文字</small></button></div></div>
<div class="group shape-tools"><label>形状</label><div class="tools"><button data-tool="pan" title="移动画布 H">✥<small>移动</small></button><button data-tool="line" title="直线 L">╱<small>直线</small></button><button data-tool="rect" title="矩形 R">□<small>矩形</small></button><button data-tool="ellipse" title="椭圆 O">○<small>椭圆</small></button></div></div>
<div class="group settings"><label for="size">粗细 <b id="sizeLabel">6 px</b></label><input id="size" type="range" min="1" max="80" value="6"><label class="check"><input id="solid" type="checkbox"> 填充形状</label></div>
<div class="group colors"><button id="colorToggle" aria-label="展开颜色选择" aria-expanded="false" aria-controls="colorPanel" title="选择颜色"><span id="colorDot"></span></button></div>
</section>
<nav id="fileMenu" class="floating-panel" aria-label="文件操作" hidden><button data-action="new">新建画布</button><button data-action="open">打开图片</button><button data-action="save">导出图片（PNG）</button><button id="saveCanvas">保存画布到本机</button><button id="restoreCanvas" hidden>恢复已保存画布</button><div class="menu-history"><button id="menuUndo" data-action="undo">↶ 撤销</button><button id="menuRedo" data-action="redo">↷ 重做</button></div></nav>
<section id="colorPanel" class="floating-panel" aria-label="颜色选择" hidden><div class="palette-heading">选择颜色 <span id="hex">#2563eb</span><button id="closeColors" aria-label="关闭颜色选择">×</button></div><div id="palette"></div><label class="custom-color">自定义颜色<input id="color" type="color" value="#2563eb" aria-label="自定义颜色"></label></section>
<div class="document-bar"><div><span class="dot"></span><span id="filename">未命名作品</span><span class="tag">仅存储在本机</span></div><button id="resize">画布尺寸 ↗</button></div>
<section class="workspace" id="workspace"><div class="canvas-wrap" id="wrap"><canvas id="canvas" width="1200" height="760" aria-label="绘图画布"></canvas></div></section>
<footer><div><span id="toolLabel">✎ 画笔</span><span id="coords">滚轮缩放画布</span></div><div><span id="dimensions">1200 × 760 像素</span><button id="fit" title="适合窗口">适合窗口</button><input id="zoom" type="range" min="10" max="400" value="75" aria-label="缩放"><span id="zoomLabel" title="在画布区域滚动鼠标滚轮缩放">75%</span></div></footer>
</main><input type="file" id="file" accept="image/*" hidden><div id="toast" role="status"></div>
<dialog id="textDialog"><form method="dialog"><h2>添加文字</h2><textarea id="textInput" placeholder="写下你的灵感…" rows="3"></textarea><label>字号 <input id="fontSize" type="number" min="8" max="240" value="32"></label><div class="dialog-actions"><button value="cancel">取消</button><button value="ok" class="primary">添加文字</button></div></form></dialog>
<script src="app.js?v=mobile-2"></script></body></html>
